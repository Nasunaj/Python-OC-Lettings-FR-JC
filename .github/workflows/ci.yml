# CI/CD pipeline for OC Lettings.
# Quality gate on every push; Docker image build and push on main only.
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  workflow_dispatch:

jobs:
  quality:
    name: Lint and tests (flake8, pytest, coverage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8

      - name: Run tests with coverage (fail under 80%)
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  docker:
    name: Build and push Docker image to Docker Hub
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nasunaj/oc-lettings:latest
            nasunaj/oc-lettings:${{ github.sha }}